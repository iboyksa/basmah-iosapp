name: Build iOS IPA (Unsigned for AltStore / Sideloadly / TrollStore)

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project (Compatible Format)
        run: |
          xcodegen generate
          sed -i '' 's/objectVersion = 77;/objectVersion = 56;/g' BasmahAttendance.xcodeproj/project.pbxproj

      - name: Build Unsigned iOS App
        run: |
          xcodebuild clean build \
            -project BasmahAttendance.xcodeproj \
            -scheme BasmahAttendance \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package into .ipa
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/BasmahAttendance.app Payload/
          zip -r BasmahAttendance.ipa Payload

      - name: Upload BasmahAttendance.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BasmahAttendance-IPA
          path: BasmahAttendance.ipa
